<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Ticket Management System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
<h1>🚀 Ticket Management System</h1>
<p class="subtitle">Submit & Track Complaints Efficiently</p>
</header>

<div class="tabs">
<button class="tab-btn active" data-tab="submit">📝 Submit Complaint</button>
<button class="tab-btn" data-tab="track">🔍 Track Ticket</button>
<button class="tab-btn" data-tab="admin">⚙️ Admin Dashboard</button>
</div>


<!-- =========================
     SUBMIT COMPLAINT
========================= -->

<div id="submit" class="tab-content active">

<form id="complaintForm">

<div class="form-group">
<label>Full Name *</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Email *</label>
<input type="email" id="email" required>
</div>

<div class="form-group">
<label>Subject *</label>
<input type="text" id="subject" required>
</div>

<div class="form-group">
<label>Description *</label>
<textarea id="description" required placeholder="Describe your issue in detail..."></textarea>
</div>

<div class="form-group">
<label>Priority *</label>

<select id="priority" required>

<option value="">Select Priority</option>
<option value="Low">Low</option>
<option value="Medium">Medium</option>
<option value="High">High</option>

</select>

</div>


<!-- FILE UPLOAD -->

<div class="form-group">

<label>Supporting Files (Optional)</label>

<div class="file-upload">

<input type="file"
id="fileUpload"
accept="image/*,.pdf"
multiple>

<label for="fileUpload" class="file-upload-label">
📎 Choose Files
</label>

</div>

<!-- File Preview -->

<div id="fileInfo"></div>

<small class="file-info">
Max 500KB per file (Images & PDFs)
</small>

</div>


<button type="submit" class="btn" id="submitBtn">
🚀 Submit Complaint
</button>

</form>

<div id="submitResult"></div>

</div>


<!-- =========================
     TRACK TICKET
========================= -->

<div id="track" class="tab-content">

<div class="form-group">

<label>Enter Ticket ID</label>

<input
type="text"
id="trackTicketId"
placeholder="e.g., TKT-2026-001">

<button
class="btn"
id="trackBtn">

🔍 Track Status

</button>

</div>

<div id="trackResult"></div>

</div>


<!-- =========================
     ADMIN DASHBOARD
========================= -->

<div id="admin" class="tab-content">


<!-- ADMIN LOGIN -->

<div id="adminLoginSection">

<h2>🔐 Admin Login</h2>

<input
type="text"
id="adminUsername"
placeholder="Admin ID">

<input
type="password"
id="adminPassword"
placeholder="Password">

<button class="btn" id="adminLoginBtn">
Login
</button>

<p id="adminError" style="color:red;"></p>

</div>


<!-- ADMIN PANEL -->

<div id="adminDashboardSection" style="display:none;">


<div class="search-filter">

<input
type="text"
id="searchTicket"
placeholder="🔍 Search by name, email, or subject...">

<select id="filterStatus">

<option value="">All Status</option>
<option value="Pending">Pending</option>
<option value="In Progress">In Progress</option>
<option value="Resolved">Resolved</option>

</select>


<select id="filterPriority">

<option value="">All Priorities</option>
<option value="Low">Low</option>
<option value="Medium">Medium</option>
<option value="High">High</option>

</select>


<button class="btn" id="refreshBtn">
🔄 Refresh
</button>

</div>


<div id="adminResult"></div>

</div>

</div>


</div>

<script src="script.js"></script>

</body>
</html>
